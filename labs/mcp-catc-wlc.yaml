# catc-mcp-server D14 lab. Import: uv run --directory ~/MCP-Suite/cml-mcp-server python ~/MCP-Suite/scripts/import_lab.py mcp-catc-wlc --file ~/MCP-Suite/catc-mcp-server/labs/mcp-catc-wlc.yaml --start
nodes:
- id: n0
  label: ext
  node_definition: external_connector
  x: 0
  y: 0
  configuration:
  - name: default
    content: System Bridge
  tags: []
  interfaces:
  - id: i0
    label: port
    mac_address: null
    type: physical
    slot: 0
- id: n1
  label: wlc
  node_definition: cat9800
  x: 0
  y: 160
  configuration:
  - name: iosxe_config.txt
    content: "platform console serial\nhostname mcp-catc-wlc\nip domain name mcp.lab\nno ip domain lookup\nusername netadmin privilege 15 secret ${LAB_CLI_PASSWORD}\nenable secret ${LAB_CLI_PASSWORD}\n\
      aaa new-model\naaa authentication login default local\naaa authentication login CONSOLE local\naaa authorization exec default local\ninterface GigabitEthernet1\n description management to the lab 198.18.128.0/18\n\
      \ no switchport\n ip address 198.18.128.173 255.255.192.0\n no shutdown\nip route 0.0.0.0 0.0.0.0 198.18.128.1\nwireless management interface GigabitEthernet1\ncrypto key generate rsa modulus 2048\n\
      ip ssh version 2\nnetconf-yang\nsnmp-server community ${LAB_SNMP_RO} RO\nsnmp-server community ${LAB_SNMP_RW} RW\nline con 0\n exec-timeout 0 0\n logging synchronous\n login authentication CONSOLE\n\
      line vty 0 15\n transport input ssh\nend"
  tags: []
  interfaces:
  - id: i0
    label: GigabitEthernet1
    mac_address: null
    type: physical
    slot: 0
  - id: i1
    label: GigabitEthernet2
    mac_address: null
    type: physical
    slot: 1
  - id: i2
    label: GigabitEthernet3
    mac_address: null
    type: physical
    slot: 2
  pyats:
    username: netadmin
    password: ${LAB_CLI_PASSWORD}
    enable_password: ${LAB_CLI_PASSWORD}
links:
- id: l0
  n1: n1
  n2: n0
  i1: i0
  i2: i0
  label: wlc-GigabitEthernet1<->ext-port
lab:
  title: mcp-catc-wlc
  description: 'catc-mcp-server D14: Catalyst 9800-CL WLC (mcp-catc-wlc, 198.18.128.173) for Catalyst Center wireless provisioning; no APs (CML has no CAPWAP AP)'
  notes: ''
  version: 0.3.1
