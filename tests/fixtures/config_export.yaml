  description: defaultNetConfPort
  port: 830
- type: SNMPV2_READ_COMMUNITY
  description: mcp-test-snmp-ro
- type: SNMPV2_WRITE_COMMUNITY
  description: mcp-test-snmp-rw
template_projects:
- name: mcp-d36-src
  description: D36 live test source project
- name: mcp-test-dayn
  description: mcp-test-dayn
templates:
- project: mcp-d36-src
  name: mcp-d36-hosts
  description: 'D36 live test: harmless ip host entries'
  composite: false
  content: |-
    ip host mcp-d36-a 192.0.2.61
    ip host mcp-d36-b 192.0.2.62
  deviceTypes:
  - productFamily: Routers
  language: JINJA
  softwareType: IOS-XE
- project: mcp-test-dayn
  name: mcp-test-cdp
  composite: false
  content: |-
    cdp run
    interface GigabitEthernet2
     cdp enable
  deviceTypes:
  - productFamily: Routers
  language: JINJA
  softwareType: IOS-XE
- project: mcp-test-dayn
  name: mcp-test-loopback
  composite: false
  content: |-
    interface Loopback{{ loop_id }}
     description {{ desc }}
     ip address {{ ip }} 255.255.255.255
  deviceTypes:
  - productFamily: Routers
  language: JINJA
  params:
  - dataType: STRING
    parameterName: desc
    required: true
  - dataType: STRING
    parameterName: ip
    required: true
  - dataType: STRING
    parameterName: loop_id
    required: true
  softwareType: IOS-XE
- project: mcp-test-dayn
  name: mcp-test-port-open
  composite: false
  content: |-
    interface {{ port }}
     authentication open
  deviceTypes:
  - productFamily: Switches and Hubs
  language: JINJA
  params:
  - dataType: STRING
    parameterName: port
    required: true
  softwareType: IOS-XE
